<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <title>Faculty Directory</title>
</head>
<body>

<div class="container">

<h4>School of IT Faculty</h4>

<hr>

<table class="table table-bordered">
    <thead>
    <tr class="bg-danger">
        <th>First Name</th>
        <th>Last Name</th>
        <th>Title</th>
        <th>Email</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="theFaculty : ${faculties}">
        <td th:text="${theFaculty.firstname}"/>
        <td th:text="${theFaculty.lastname}"/>
        <td th:text="${theFaculty.title}"/>
        <td th:text="${theFaculty.email}"/>

    </tr>
    </tbody>
</table>

</body>
</html>
